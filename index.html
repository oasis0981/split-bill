<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정산 계산기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-light: #f9fafb;
            --bg-white: #ffffff;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --border-gray: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ============ HEADER ============ */
        .header {
            margin-bottom: 24px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .header p {
            font-size: 14px;
            color: var(--text-gray);
        }

        /* ============ TABS ============ */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-gray);
        }

        .tab-btn {
            padding: 12px 16px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-gray);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-btn:hover {
            color: var(--text-dark);
        }

        /* ============ TAB CONTENT ============ */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ============ INPUT SECTION ============ */
        .input-section {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        .section-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-group input,
        .input-group select {
            padding: 12px 14px;
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .input-group input::placeholder {
            color: var(--text-gray);
        }

        /* Checkbox styling for participants */
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
            max-height: 150px;
            overflow-y: auto;
            padding: 8px;
            background: #fafafa;
            border-radius: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox-item label {
            font-size: 13px;
            color: var(--text-dark);
            cursor: pointer;
            flex: 1;
        }

        .btn-add {
            padding: 12px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-add:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        /* ============ SUMMARY CARD ============ */
        .summary-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
        }

        .summary-row label {
            opacity: 0.9;
        }

        .summary-row .value {
            font-weight: 700;
            font-size: 16px;
        }

        /* ============ BURDEN CARD ============ */
        .burden-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .burden-item {
            background: var(--bg-white);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--primary);
            transition: all 0.2s;
        }

        .burden-item:hover {
            box-shadow: var(--shadow-md);
        }

        .burden-info {
            flex: 1;
        }

        .burden-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .burden-detail {
            font-size: 12px;
            color: var(--text-gray);
            line-height: 1.4;
        }

        .burden-amount {
            text-align: right;
        }

        .burden-amount .label {
            font-size: 11px;
            color: var(--text-gray);
            display: block;
            margin-bottom: 4px;
        }

        .burden-amount .value {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
        }

        /* ============ PARTICIPANTS LIST ============ */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .participants-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .participant-item {
            background: var(--bg-white);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .participant-item:hover {
            box-shadow: var(--shadow-md);
        }

        .participant-info {
            flex: 1;
        }

        .participant-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .btn-delete {
            padding: 6px 12px;
            background: #fee2e2;
            color: var(--danger);
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .btn-delete:hover {
            background: #fecaca;
        }

        /* ============ EXPENSE ITEM ============ */
        .expense-item {
            background: var(--bg-white);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 8px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .expense-item:hover {
            box-shadow: var(--shadow-md);
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .expense-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .expense-location {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 2px;
        }

        .expense-amount {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
        }

        .expense-payer {
            font-size: 12px;
            color: var(--text-gray);
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-gray);
        }

        .expense-users {
            font-size: 12px;
            color: var(--text-gray);
            line-height: 1.5;
        }

        .expense-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-small {
            flex: 1;
            padding: 6px 10px;
            font-size: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-remove {
            background: #fee2e2;
            color: var(--danger);
        }

        .btn-remove:hover {
            background: #fecaca;
        }

        /* ============ SETTLEMENT SECTION ============ */
        .settlement-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .settlement-item {
            background: var(--bg-white);
            border-radius: 8px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--primary);
        }

        .settlement-item.complete {
            border-left-color: var(--success);
            background: #f0fdf4;
        }

        .settlement-from {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .settlement-amount {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
        }

        .settlement-item.complete .settlement-amount {
            color: var(--success);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-gray);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
        }

        /* ============ STATISTICS ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--bg-white);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .stat-box.positive .stat-value {
            color: var(--success);
        }

        .stat-box.negative .stat-value {
            color: var(--danger);
        }

        /* ============ FOOTER ============ */
        .footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border-gray);
            text-align: center;
            font-size: 12px;
            color: var(--text-gray);
        }

        /* ============ ANIMATIONS ============ */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .participant-item,
        .expense-item,
        .burden-item {
            animation: slideIn 0.3s ease;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }

            .header h1 {
                font-size: 24px;
            }

            .input-section {
                padding: 16px;
            }

            .summary-card {
                padding: 16px;
            }

            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .burden-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .burden-amount {
                width: 100%;
                text-align: left;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 정산 계산기</h1>
            <p>누가 사용했는지 명확하게 정산하세요</p>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('participants')">참여자</button>
            <button class="tab-btn" onclick="switchTab('expenses')">지출 내역</button>
            <button class="tab-btn" onclick="switchTab('settlement')">정산 결과</button>
        </div>

        <!-- TAB 1: PARTICIPANTS -->
        <div id="participants" class="tab-content active">
            <div class="input-section">
                <div class="section-label">참여자 추가</div>
                <div class="input-group">
                    <input type="text" id="nameInput" placeholder="이름" maxlength="20">
                </div>
                <button class="btn-add" onclick="addParticipant()">+ 참여자 추가</button>
            </div>

            <div class="section-title">참여자 목록</div>
            <div class="participants-list" id="participantsList"></div>
        </div>

        <!-- TAB 2: EXPENSES -->
        <div id="expenses" class="tab-content">
            <div class="input-section">
                <div class="section-label">지출 기록</div>
                <div class="input-group">
                    <input type="text" id="expenseLocation" placeholder="어디에서? (예: 식당, 카페)" maxlength="30">
                    <input type="number" id="expenseAmount" placeholder="금액" min="0" step="100">
                    <select id="expensePayer">
                        <option value="">누가 냈나요?</option>
                    </select>
                </div>

                <div class="section-label" style="margin-top: 16px; margin-bottom: 8px;">누가 사용했나요?</div>
                <div class="checkbox-group" id="userCheckboxes"></div>

                <button class="btn-add" onclick="addExpense()" style="margin-top: 16px;">+ 지출 추가</button>
            </div>

            <div class="section-title">지출 내역</div>
            <div id="expensesList"></div>
        </div>

        <!-- TAB 3: SETTLEMENT -->
        <div id="settlement" class="tab-content">
            <!-- SUMMARY CARD -->
            <div class="summary-card">
                <div class="summary-row">
                    <label>총 지출</label>
                    <span class="value" id="totalAmount">₩0</span>
                </div>
                <div class="summary-row">
                    <label>참여 인원</label>
                    <span class="value" id="participantCount">0명</span>
                </div>
            </div>

            <!-- INDIVIDUAL BURDEN -->
            <div class="section-title">개인별 부담금</div>
            <div class="burden-list" id="burdenList"></div>

            <!-- STATISTICS -->
            <div class="stats-grid" id="statsGrid" style="display: none;">
                <div class="stat-box positive">
                    <div class="stat-label">받을 사람</div>
                    <div class="stat-value" id="receiverCount">0명</div>
                </div>
                <div class="stat-box negative">
                    <div class="stat-label">낼 사람</div>
                    <div class="stat-value" id="payerCount">0명</div>
                </div>
            </div>

            <!-- SETTLEMENT RESULTS -->
            <div class="section-title">정산 내역</div>
            <div class="settlement-list" id="settlementList"></div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <p>❤️ 아줌마잘먹지? ❤️</p>
        </div>
    </div>

    <script>
        // ============ DATA MANAGEMENT ============
        let participants = [
            { id: 1, name: '오리' },
            { id: 2, name: '이유' },
            { id: 3, name: '융도' }
        ];
        let expenses = [];

        // Initialize from URL parameters
        function initializeFromURL() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            if (data) {
                try {
                    const parsed = JSON.parse(atob(data));
                    participants = parsed.participants || participants;
                    expenses = parsed.expenses || [];
                    updateDisplay();
                } catch (e) {
                    console.log('Invalid data in URL');
                }
            }
        }

        // ============ TAB SWITCHING ============
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Refresh UI
            updateDisplay();
        }

        // ============ ADD PARTICIPANT ============
        function addParticipant() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();

            if (!name) {
                alert('이름을 입력하세요');
                nameInput.focus();
                return;
            }

            if (participants.some(p => p.name === name)) {
                alert('이미 있는 참여자입니다');
                return;
            }

            participants.push({
                id: Date.now(),
                name: name
            });

            nameInput.value = '';
            nameInput.focus();
            updateDisplay();
        }

        // ============ DELETE PARTICIPANT ============
        function deleteParticipant(id) {
            participants = participants.filter(p => p.id !== id);
            // 삭제된 참여자의 지출도 제거
            expenses = expenses.filter(e => e.payerId !== id && !e.users.includes(id));
            updateDisplay();
        }

        // ============ ADD EXPENSE ============
        function addExpense() {
            const location = document.getElementById('expenseLocation').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value) || 0;
            const payerId = parseInt(document.getElementById('expensePayer').value);

            if (!location) {
                alert('지출처를 입력하세요');
                return;
            }

            if (amount <= 0) {
                alert('금액을 입력하세요');
                return;
            }

            if (!payerId) {
                alert('누가 냈는지 선택하세요');
                return;
            }

            const users = [];
            document.querySelectorAll('#userCheckboxes input[type="checkbox"]:checked').forEach(checkbox => {
                users.push(parseInt(checkbox.value));
            });

            if (users.length === 0) {
                alert('최소 1명 이상이 사용했어야 합니다');
                return;
            }

            expenses.push({
                id: Date.now(),
                location: location,
                amount: amount,
                payerId: payerId,
                payer: participants.find(p => p.id === payerId).name,
                users: users,
                userNames: users.map(uid => participants.find(p => p.id === uid).name)
            });

            // Reset form
            document.getElementById('expenseLocation').value = '';
            document.getElementById('expenseAmount').value = '';
            document.getElementById('expensePayer').value = '';
            document.querySelectorAll('#userCheckboxes input[type="checkbox"]').forEach(cb => cb.checked = false);

            updateDisplay();
        }

        // ============ DELETE EXPENSE ============
        function deleteExpense(id) {
            expenses = expenses.filter(e => e.id !== id);
            updateDisplay();
        }

        // ============ CORE CALCULATION LOGIC ============
        function calculateSettlement() {
            if (participants.length === 0 || expenses.length === 0) {
                return {
                    total: 0,
                    adjustments: [],
                    settlements: [],
                    creditorCount: 0,
                    debtorCount: 0
                };
            }

            // 1. 각 참여자가 실제로 사용한 금액 계산
            const usage = {};
            participants.forEach(p => {
                usage[p.id] = 0;
            });

            expenses.forEach(expense => {
                const perUser = expense.amount / expense.users.length;
                expense.users.forEach(userId => {
                    usage[userId] = (usage[userId] || 0) + perUser;
                });
            });

            // 2. 각 참여자가 낸 금액
            const paid = {};
            participants.forEach(p => {
                paid[p.id] = 0;
            });

            expenses.forEach(expense => {
                paid[expense.payerId] = (paid[expense.payerId] || 0) + expense.amount;
            });

            // 3. 총액 계산
            const total = expenses.reduce((sum, e) => sum + e.amount, 0);

            // 4. 개인별 차액 계산
            const adjustments = participants.map(p => ({
                id: p.id,
                name: p.name,
                paid: paid[p.id],
                usage: usage[p.id],
                difference: paid[p.id] - usage[p.id]
            }));

            // 5. 송금 매칭 로직
            const creditors = adjustments
                .filter(a => a.difference > 0.01)
                .sort((a, b) => b.difference - a.difference);

            const debtors = adjustments
                .filter(a => a.difference < -0.01)
                .map(a => ({ ...a, remaining: Math.abs(a.difference) }))
                .sort((a, b) => b.remaining - a.remaining);

            const settlements = [];

            for (let debtor of debtors) {
                while (debtor.remaining > 0.01) {
                    const creditor = creditors.find(c => c.difference > 0.01);
                    if (!creditor) break;

                    const transferAmount = Math.min(debtor.remaining, creditor.difference);
                    settlements.push({
                        from: debtor.name,
                        to: creditor.name,
                        amount: Math.round(transferAmount)
                    });

                    debtor.remaining -= transferAmount;
                    creditor.difference -= transferAmount;
                }
            }

            return {
                total: Math.round(total),
                adjustments: adjustments,
                settlements: settlements,
                creditorCount: creditors.length,
                debtorCount: debtors.length
            };
        }

        // ============ UPDATE DISPLAY ============
        function updateDisplay() {
            // Update participant list
            const participantsList = document.getElementById('participantsList');
            const expensePayer = document.getElementById('expensePayer');
            const userCheckboxes = document.getElementById('userCheckboxes');

            if (participants.length === 0) {
                participantsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👥</div>
                        <div class="empty-state-text">먼저 참여자를 추가하세요</div>
                    </div>
                `;
                expensePayer.innerHTML = '<option value="">참여자를 먼저 추가하세요</option>';
                userCheckboxes.innerHTML = '';
            } else {
                // Participants list
                participantsList.innerHTML = participants.map(p => `
                    <div class="participant-item">
                        <div class="participant-info">
                            <div class="participant-name">${p.name}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteParticipant(${p.id})">삭제</button>
                    </div>
                `).join('');

                // Payer dropdown
                expensePayer.innerHTML = '<option value="">누가 냈나요?</option>' + 
                    participants.map(p => `
                        <option value="${p.id}">${p.name}</option>
                    `).join('');

                // User checkboxes
                userCheckboxes.innerHTML = participants.map(p => `
                    <div class="checkbox-item">
                        <input type="checkbox" id="user-${p.id}" value="${p.id}" checked>
                        <label for="user-${p.id}">${p.name}</label>
                    </div>
                `).join('');
            }

            // Update expenses list
            const expensesList = document.getElementById('expensesList');
            if (expenses.length === 0) {
                expensesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <div class="empty-state-text">지출을 추가하세요</div>
                    </div>
                `;
            } else {
                expensesList.innerHTML = expenses.map(expense => `
                    <div class="expense-item">
                        <div class="expense-header">
                            <div>
                                <div class="expense-title">${expense.location}</div>
                                <div class="expense-location">💰 ${expense.payer}가 지출</div>
                            </div>
                            <div class="expense-amount">₩${Math.round(expense.amount).toLocaleString()}</div>
                        </div>
                        <div class="expense-payer">
                            <strong>사용자:</strong> ${expense.userNames.join(', ')} (${expense.userNames.length}명)
                        </div>
                        <div class="expense-actions">
                            <button class="btn-small btn-remove" onclick="deleteExpense(${expense.id})">삭제</button>
                        </div>
                    </div>
                `).join('');
            }

            // Calculate settlement
            const result = calculateSettlement();

            // Update summary
            document.getElementById('totalAmount').textContent = 
                `₩${result.total.toLocaleString()}`;
            document.getElementById('participantCount').textContent = 
                `${participants.length}명`;

            // Update burden list
            const burdenList = document.getElementById('burdenList');
            if (expenses.length === 0) {
                burdenList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💡</div>
                        <div class="empty-state-text">지출을 추가하면 개인별 부담금이 계산됩니다</div>
                    </div>
                `;
            } else {
                burdenList.innerHTML = result.adjustments.map(adj => `
                    <div class="burden-item">
                        <div class="burden-info">
                            <div class="burden-name">${adj.name}</div>
                            <div class="burden-detail">
                                <strong>낸 금액:</strong> ₩${Math.round(adj.paid).toLocaleString()} | 
                                <strong>사용한 금액:</strong> ₩${Math.round(adj.usage).toLocaleString()}
                            </div>
                        </div>
                        <div class="burden-amount">
                            <span class="label">${adj.difference > 0 ? '받을 돈' : adj.difference < 0 ? '낼 돈' : '정산완료'}</span>
                            <span class="value" style="color: ${adj.difference > 0 ? 'var(--success)' : adj.difference < 0 ? 'var(--danger)' : 'var(--text-gray)'}">
                                ₩${Math.abs(Math.round(adj.difference)).toLocaleString()}
                            </span>
                        </div>
                    </div>
                `).join('');
            }

            // Update statistics
            const statsGrid = document.getElementById('statsGrid');
            if (expenses.length > 0) {
                statsGrid.style.display = 'grid';
                document.getElementById('receiverCount').textContent = 
                    `${result.creditorCount}명`;
                document.getElementById('payerCount').textContent = 
                    `${result.debtorCount}명`;
            } else {
                statsGrid.style.display = 'none';
            }

            // Update settlement list
            const settlementList = document.getElementById('settlementList');
            if (result.settlements.length === 0) {
                if (expenses.length === 0) {
                    settlementList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📊</div>
                            <div class="empty-state-text">정산 계획이 여기에 표시됩니다</div>
                        </div>
                    `;
                } else {
                    settlementList.innerHTML = `
                        <div class="settlement-item complete">
                            <div class="settlement-from">✅ 모두 정산 완료!</div>
                            <div class="settlement-amount">처리할 항목 없음</div>
                        </div>
                    `;
                }
            } else {
                settlementList.innerHTML = result.settlements.map(s => `
                    <div class="settlement-item">
                        <div class="settlement-from">${s.from} → ${s.to}</div>
                        <div class="settlement-amount">₩${s.amount.toLocaleString()}</div>
                    </div>
                `).join('');
            }
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addParticipant();
        });

        // Initialize
        initializeFromURL();
        updateDisplay();
    </script>
</body>
</html>
